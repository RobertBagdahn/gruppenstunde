   "@type": "Comment",
   "text": "Hallo susannedesic,\r\n\r\nich habe heute einmal dein Rezept ausprobiert.\r\nIch vermute aber das sich in der Wassermenge ein Fehler eingeschlichen hat. Denn mit 75 ml haut dieser Teig einfach nicht hin. Ich musste noch 300 ml mehr Wasser nehmen bis der Teig endlich schön geschmeidig war.\r\nDas Ergebnis konnte sich allerdings sehen lassen. Bin gespannt wie dieser Zopf schmeckt.\r\n\r\n@ JaJuJö\r\nich kann mir nicht vorstellen, das Du dieses Rezept so mit 75 ml Wasser hin bekommen hast.\r\nDu musstest sicherlich auch mehr Flüssigkeit nehmen und das hättest Du dazu schreiben können, damit die anderen User die es auch gern einmal ausprobieren wollen wissen.\r\n\r\nLG Smartie",

   },
   "upvoteCount": 2
  },
  {
   "@type": "Comment",
   "text": "Auch ich habe natürlich wesentlich mehr Wasser gebraucht (ca 200 ml mehr). Die lange Aufgehzeit lohnt sich wirklich. Ich werde beim nächsten Mal ein kleines bisschen weniger Salz nehmen, aber das ist ja Geschmacksache.\r\nJedenfalls: sehr empfehlenswert! \r\nLG Teddy\r\n",

   }
  },
  {
   "@type": "Comment",
   "text": "Hallo.\r\n\r\nIch probiere dieses Rezept jetzt schon einige Wochen aus und es funktioniert auch einigermaßen, aber ich habe folgendes Problem und dazu eine Frage:\r\n\r\nJedes Mal, wenn ich den Teig knete wird er richtig krümmellig (obwohl ich mich genau ans Rezept gehalten habe) und, wenn ich ihn zwei Stunden habe gehen lassen und Öl (wie angegeben) drauf geschmiert habe ändert das nichts daran! Und jedes Mal zerfällt er mir, wenn ich Rollen draus  formen möchte (heute war es so schlimm, dass ich nur eine Challah hinbekommen habe, weil er einfach zu brüchig ist. Ich versuche es auch schon mal mit etwas Milch oder mit Wasser, aber viel hilft auch das leider nicht. Meine Frage nun: Was muss oder kann ich ändern, damit er nicht mehr so krümmelig ist bzw. nicht mehr zerfällt? Bin schon wirklich am verzweifeln! :-(\r\n\r\nFür eure Antworten bedanke ich mich im Voraus \r\n\r\n\r\nMarkus",
