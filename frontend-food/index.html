<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Inspi Food – Rezepte und Essensplanung für Pfadfinder-Gruppen." />
    <meta name="theme-color" content="#1F4D3A" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet" />
    <style>
      /* Boot splash: shown until React mounts and replaces #root's content. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #1F4D3A; color: #fff; font-family: "Bricolage Grotesque", system-ui, sans-serif; }
      .boot-mark { width: 64px; height: 64px; border-radius: 18px; background: #C2410C; display: flex; align-items: center; justify-content: center; animation: boot-bob 1.4s ease-in-out infinite; }
      .boot-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #D4E3D9; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar::after { animation: none; } }
    </style>
    <title>Inspi Food – Rezepte & Essensplanung</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="essensplan wird geladen">
        <div class="boot-mark" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/></svg>
        </div>
        <div class="boot-name">essensplan</div>
        <div class="boot-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
