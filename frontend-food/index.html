<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inspi Food – Rezepte und Essensplanung für Pfadfinder-Gruppen." />
    <meta name="theme-color" content="#0F6E7A" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <!-- Self-hosted fonts (public/fonts/README.md): the display face is needed for the first paint. -->
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Boot splash: shown until React mounts and replaces #root's content. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFFFFF; color: #1B1F1D; font-family: "Bricolage Grotesque", system-ui, sans-serif; }
      .boot-mark { width: 64px; height: 64px; border-radius: 18px; background: #E3F3F5; display: flex; align-items: center; justify-content: center; animation: boot-bob 1.4s ease-in-out infinite; }
      .boot-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; background: #EEF0EE; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #0F6E7A; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar::after { animation: none; } }
    </style>
    <title>Inspi Food – Rezepte & Essensplanung</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="essensplan wird geladen">
        <div class="boot-mark" aria-hidden="true"><img src="/images/inspi-logo.webp" width="56" height="56" alt="" /></div>
        <div class="boot-name">essensplan</div>
        <div class="boot-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
