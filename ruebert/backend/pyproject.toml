[project]
name = "ruebert-backend"
version = "0.1.0"
description = "Rübert – Bedarfsprognose und Bestellplanung für DeineGartenwelt (Backend, Version 2)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "duckdb>=1.1,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.28,<1.0",
    "pyyaml>=6.0,<7.0",
    "python-frontmatter>=1.1,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
    "pyright[nodejs]>=1.1.390,<2.0",
    "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruebert"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "T20",  # no print in production code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "E501"]  # descriptive test names and long SQL strings

[tool.pyright]
include = ["ruebert", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["ruebert"]  # production code strict; tests work with untyped JSON responses
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
