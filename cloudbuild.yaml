# Cloud Build – Deploy Pipeline
# Triggered by Cloud Build triggers (dev: develop branch, prod: main branch)
# Substitution variables _ENVIRONMENT, _BACKEND_SERVICE, _FRONTEND_BUCKET
# are set by the Terraform-managed trigger.

steps:
  # Run required checks on the deploy commit. This trigger is also a release gate.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - builds
      - submit
      - --config=cloudbuild-pr.yaml
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - .
    id: release-checks
    waitFor: ['-']

  # -----------------------------------------------
  # 1. Build Backend Container Image
  # -----------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:$COMMIT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:${_ENVIRONMENT}-latest'
      - -f
      - Dockerfile.backend
      - .
    id: build-backend
    waitFor: ['release-checks']

  # -----------------------------------------------
  # 2. Push Backend Image to Artifact Registry
  # -----------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend'
    id: push-backend
    waitFor: ['build-backend']

  # -----------------------------------------------
  # 3. Build Frontend (Vite)
  # -----------------------------------------------
  - name: 'node:20'
    entrypoint: bash
    args:
      - -c
      - cd frontend && npm ci && npm run build
    id: build-frontend
    waitFor: ['release-checks']

  # -----------------------------------------------
  # 4. Deploy Backend to Cloud Run
  # -----------------------------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:$COMMIT_SHA
      - --region=${_REGION}
      - --port=8000
      - --allow-unauthenticated
      - --max=${_BACKEND_MAX_INSTANCES}
      - --concurrency=${_BACKEND_CONCURRENCY}
      - --update-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,BACKEND_MAX_INSTANCES=${_BACKEND_MAX_INSTANCES},BACKEND_CONCURRENCY=${_BACKEND_CONCURRENCY},GUNICORN_WORKERS=2,GUNICORN_THREADS=4,BACKGROUND_WORKERS_PER_PROCESS=1,DB_CONNECTION_RESERVE=8
    id: deploy-backend
    waitFor: ['push-backend', 'release-checks']

  # -----------------------------------------------
  # 5. Deploy Frontend to GCS
  # -----------------------------------------------
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - -m
      - rsync
      - -r
      - -d
      - frontend/dist/
      - 'gs://${_FRONTEND_BUCKET}/'
    id: deploy-frontend
    waitFor: ['build-frontend', 'release-checks']

  # -----------------------------------------------
  # 6. Run Django Migrations (after deploy)
  # -----------------------------------------------
  - name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:$COMMIT_SHA'
    entrypoint: python
    args: ['manage.py', 'migrate', '--noinput']
    id: migrate
    waitFor: ['deploy-backend']
    env:
      - 'DJANGO_SETTINGS_MODULE=inspi.settings.production'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

substitutions:
  _REGION: europe-west3
  _ENVIRONMENT: dev
  _BACKEND_SERVICE: inspi-dev-backend
  _FRONTEND_BUCKET: inspi-dev-static
  _BACKEND_MAX_INSTANCES: '2'
  _BACKEND_CONCURRENCY: '2'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/inspi/backend:${_ENVIRONMENT}-latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
