# Pre-commit hooks for Inspi
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: tsconfig\.json$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: local
    hooks:
      - id: playwright-mobile-ingredient-autocomplete
        name: Playwright mobile ingredient autocomplete
        entry: bash e2e/smoke-test.sh --food-only --reuse-running --grep=autocomplete
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|e2e/(package(-lock)?\.json|playwright\.config\.ts|smoke-test\.sh|tests/recipe-ingredient-editing\.spec\.ts)|frontend-food/src/components/recipe/(IngredientAutocomplete|InlineIngredientEditor)\.tsx)$
        stages: [pre-commit]
      - id: pytest
        name: pytest (fast tests only)
        entry: bash -c 'cd backend && uv run python -m pytest -x -q --tb=short -m "not slow"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
