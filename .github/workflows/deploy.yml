# CI/CD – the only production pipeline. Deploys Inspi to Google Cloud Run on
# every push to main (or manual dispatch) after all release gates pass.
# Mirrors .claude/skills/deploy/SKILL.md (phases 1, 3, 4, 5, 8, 9, 10).
# Local equivalent of the gates: make verify-release
# Intentionally NOT automated: OpenTofu apply, add_users, seed_all
# (data-/infra-changing, manual only).
# Auth: Workload Identity Federation (no JSON keys).
# One-time setup: scripts/setup-github-deploy.sh

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: inspi-441320
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/inspi-441320/inspi
  SQL_INSTANCE: inspi-db-west1
  BACKEND_SERVICE: inspi-backend
  FRONTEND_SERVICE: inspi-frontend
  FRONTEND_FOOD_SERVICE: inspi-frontend-food
  MIGRATE_JOB: inspi-migrate
  NODE_VERSION: "20"

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # WeasyPrint needs the same native libraries as Dockerfile.backend.
      - name: Install PDF runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            shared-mime-info fonts-dejavu-core

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
          sh scripts/check_release_format.sh

      - name: Mypy (release modules)
        run: sh scripts/check_release_types.sh

      - name: Pytest
        run: uv run pytest --tb=short -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  food-checks:
    name: Food frontend checks and mocked E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend-food/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        working-directory: frontend-food
        run: npm ci

      - name: ESLint
        working-directory: frontend-food
        run: npm run lint

      - name: TypeScript
        working-directory: frontend-food
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        working-directory: frontend-food
        run: npm test

      - name: Production build
        working-directory: frontend-food
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Starts the Food Vite dev server on :5174 and runs the Playwright
      # project "mocked" against it (no backend required).
      - name: Mocked Food E2E
        run: sh e2e/food-release-check.sh

  deploy:
    name: Build and deploy
    needs: [backend-checks, frontend-checks, food-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    # Backend runtime limits (reliable-pdf-exports: one isolated request per
    # instance). Keep identical to Dockerfile.backend, terraform/variables.tf
    # and the Makefile; backend/core/tests/test_runtime_limits.py enforces it.
    env:
      BACKEND_MAX_INSTANCES: "2"
      BACKEND_CONCURRENCY: "1"
      BACKEND_MEMORY: 1Gi
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Phase 1: pre-flight
      - name: Pre-flight checks
        run: |
          set -euo pipefail
          current_project="$(gcloud config get-value project 2>/dev/null)"
          test "$current_project" = "$PROJECT_ID" \
            || gcloud config set project "$PROJECT_ID"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud artifacts repositories describe inspi \
            --location="$REGION" \
            --format="value(name)"
          state=$(gcloud sql instances describe "$SQL_INSTANCE" \
            --format="value(state)")
          echo "Cloud SQL state: $state"
          test "$state" = "RUNNABLE"
          for svc in "$BACKEND_SERVICE" "$FRONTEND_SERVICE" \
            "$FRONTEND_FOOD_SERVICE"; do
            gcloud run services describe "$svc" --region="$REGION" \
              --format="value(metadata.name)"
          done
          gcloud run jobs describe "$MIGRATE_JOB" --region="$REGION" \
            --format="value(metadata.name)"

      # Images are built with Cloud Build (amd64), tagged with the commit
      # SHA and :latest.
      - name: Build images (Cloud Build)
        run: |
          set -euo pipefail
          build() {
            local name="$1" dockerfile="$2"
            cat > "$RUNNER_TEMP/cloudbuild-$name.yaml" <<YAML
          steps:
            - name: 'gcr.io/cloud-builders/docker'
              args:
                - 'build'
                - '-t'
                - '$REGISTRY/$name:$GITHUB_SHA'
                - '-t'
                - '$REGISTRY/$name:latest'
                - '-f'
                - '$dockerfile'
                - '.'
          images:
            - '$REGISTRY/$name:$GITHUB_SHA'
            - '$REGISTRY/$name:latest'
          YAML
            # Submit async and poll the status: streaming logs from the
            # default logs bucket requires project Viewer, which the deploy
            # service account intentionally does not have.
            local build_id status
            build_id=$(gcloud builds submit \
              --config="$RUNNER_TEMP/cloudbuild-$name.yaml" \
              --region="$REGION" --async \
              --format="value(id)" .)
            echo "[$name] Cloud Build $build_id started"
            while true; do
              status=$(gcloud builds describe "$build_id" \
                --region="$REGION" --format="value(status)")
              case "$status" in
                SUCCESS)
                  echo "[$name] build succeeded"
                  return 0 ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  echo "::error::[$name] build $build_id finished with $status"
                  gcloud builds describe "$build_id" --region="$REGION" \
                    --format="value(logUrl)"
                  return 1 ;;
              esac
              sleep 10
            done
          }
          build backend Dockerfile.backend &
          p1=$!
          build frontend Dockerfile.frontend &
          p2=$!
          build frontend-food Dockerfile.frontend-food &
          p3=$!
          rc=0
          wait $p1 || rc=1
          wait $p2 || rc=1
          wait $p3 || rc=1
          exit $rc

      # Phase 4: backend (existing secrets and other env vars are preserved;
      # runtime limits are always set from the job env above)
      - name: Deploy backend
        run: |
          set -euo pipefail
          gcloud run deploy "$BACKEND_SERVICE" \
            --image "$REGISTRY/backend:$GITHUB_SHA" \
            --region "$REGION" \
            --memory "$BACKEND_MEMORY" \
            --concurrency "$BACKEND_CONCURRENCY" \
            --max-instances "$BACKEND_MAX_INSTANCES" \
            --update-env-vars "BACKEND_MAX_INSTANCES=$BACKEND_MAX_INSTANCES,BACKEND_CONCURRENCY=$BACKEND_CONCURRENCY,GUNICORN_WORKERS=$GUNICORN_WORKERS,GUNICORN_THREADS=$GUNICORN_THREADS"
          gcloud run services update-traffic "$BACKEND_SERVICE" \
            --region "$REGION" --to-latest

      # Phase 5: migrations (job pins its image, so point it at the new
      # build first)
      - name: Run migrations
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATE_JOB" \
            --image "$REGISTRY/backend:$GITHUB_SHA" \
            --region "$REGION"
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      # Phases 8 + 9: frontends
      - name: Deploy frontend
        run: |
          set -euo pipefail
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image "$REGISTRY/frontend:$GITHUB_SHA" \
            --region "$REGION"
          gcloud run services update-traffic "$FRONTEND_SERVICE" \
            --region "$REGION" --to-latest

      - name: Deploy frontend food
        run: |
          set -euo pipefail
          gcloud run deploy "$FRONTEND_FOOD_SERVICE" \
            --image "$REGISTRY/frontend-food:$GITHUB_SHA" \
            --region "$REGION"
          gcloud run services update-traffic "$FRONTEND_FOOD_SERVICE" \
            --region "$REGION" --to-latest

      # Phases 3 + 10: smoke checks and summary
      - name: Verify and summarize
        run: |
          set -euo pipefail
          url() {
            gcloud run services describe "$1" --region="$REGION" \
              --format="value(status.url)"
          }
          check() {
            local label="$1" target="$2" code
            for _ in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$target" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "| $label | $target | $code |" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ]
          }
          {
            echo "## Deployment ${GITHUB_SHA::8}"
            echo "| Service | URL | HTTP |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          check backend "$(url "$BACKEND_SERVICE")/api/docs"
          check frontend "$(url "$FRONTEND_SERVICE")/"
          check frontend-food "$(url "$FRONTEND_FOOD_SERVICE")/"
          gcloud run services list --region="$REGION" \
            --format="table(SERVICE,REGION,URL,LAST_DEPLOYED)"
